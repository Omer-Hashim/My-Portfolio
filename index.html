<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Omer Elnour — Frontend Developer</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="dist/output.css" />
    </head>
    <body class="bg-background text-primary font-body">
        <!-- Navbar Start -->
        <header class="sticky top-4 mt-4 z-50 px-4">
            <nav aria-label="Primary" class="max-w-3xl mx-auto rounded-3xl border border-border bg-background/80 backdrop-blur shadow-sm overflow-hidden">
                <div class="flex items-center justify-between gap-4 px-6 py-3">
                    <a href="#" class="font-heading font-semibold text-primary">Omer Elnour</a>
                    <ul class="hidden md:flex items-center gap-6 font-body text-sm text-secondary">
                        <li><a href="#skills" class="hover:text-primary transition-colors">Skills</a></li>
                        <li><a href="#projects" class="hover:text-primary transition-colors">Projects</a></li>
                        <li><a href="#contact" class="hover:text-primary transition-colors">Contact</a></li>
                    </ul>
                    <a href="#" class="hidden md:inline-block rounded-full bg-accent text-white text-sm font-medium px-4 py-2 hover:bg-accent/90 transition-colors">
                        Download CV
                    </a>
                    <button
                        id="menu-toggle"
                        type="button"
                        class="md:hidden inline-flex items-center justify-center w-9 h-9 rounded-full text-primary hover:bg-accent-light transition-colors"
                        aria-expanded="false"
                        aria-controls="mobile-menu"
                        aria-label="Toggle navigation menu"
                    >
                        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="4" y1="6" x2="20" y2="6"></line>
                        <line x1="4" y1="12" x2="20" y2="12"></line>
                        <line x1="4" y1="18" x2="20" y2="18"></line>
                        </svg>
                    </button>
                </div>
                <div id="mobile-menu" class="hidden md:hidden border-t border-border px-6 py-4">
                    <ul class="flex flex-col gap-4 font-body text-sm text-secondary">
                        <li><a href="#skills" class="block hover:text-primary transition-colors">Skills</a></li>
                        <li><a href="#projects" class="block hover:text-primary transition-colors">Projects</a></li>
                        <li><a href="#contact" class="block hover:text-primary transition-colors">Contact</a></li>
                    </ul>
                    <a href="#" class="mt-4 block text-center rounded-full bg-accent text-white text-sm font-medium px-4 py-2 hover:bg-accent/90 transition-colors">
                        Download CV
                    </a>
                </div>
            </nav>
        </header>
        <!-- Navbar End -->
        <script src="main.js"></script>
    </body>
</html>
